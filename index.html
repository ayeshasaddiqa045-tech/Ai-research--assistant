<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholarAI - AI Research Assistant</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 700px; }
    h1 { color: #008080; text-align: center; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #666; margin-bottom: 25px; }
    textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; margin-bottom: 15px; resize: vertical; }
    button { width: 100%; background-color: #008080; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    button:hover { background-color: #006666; }
    #output { margin-top: 25px; padding: 15px; background: #eef7f7; border-left: 5px solid #008080; border-radius: 5px; display: none; white-space: pre-wrap; line-height: 1.6; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎓 ScholarAI</h1>
  <p class="subtitle">Your Smart AI Research Assistant</p>
  
  <label for="researchInput"><b>Paste Research Paper Text or Topic:</b></label>
  <textarea id="researchInput" placeholder="Enter research paper text, summary request, or academic topic here..."></textarea>
  
  <button onclick="analyzeText()">Analyze & Summarize Research</button>
  
  <div id="output"></div>
</div>

<script src="app.js"></script>
</body>
</html>
